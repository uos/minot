[workspace]

members = [
  "minot",
  "mt_pubsub",
  "mt_coord",
  "mt_bagread",
  "mt_rat",
  "mt_mtc",
  "mt_sea",
  "mt_wind",
  "mt_net",
  "mt_flow",
  "mt_service",
  "mt_action",
  "mt_scope",
  "mt_log",
]
resolver = "3"

[workspace.package]
version = "0.10.0"
keywords = ["robotics"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/stelzo/minot"
edition = "2024"
authors = ["Christopher Sieh <stelzo@steado.de>"]
categories = ["science::robotics"]
documentation = "https://uos.github.io/minot"
homepage = "https://uos.github.io/minot"
rust-version = "1.89.0"
exclude = [
  "**/.github/**",
  "**/tests/**",
  "**/mt/**",
  "**/benches/**",
  "**/target/**",
  "**/build/**",
  "**/dist/**",
  "**/docs/**",
  "**/venv/**",
  "**/vscode/**",
]

[workspace.dependencies]
mt_sea = { path = "mt_sea", version = "0.10.0", default-features = false }
mt_coord = { path = "mt_coord", version = "0.10.0", default-features = false }
mt_pubsub = { path = "mt_pubsub", version = "0.10.0", default-features = false }
mt_service = { path = "mt_service", version = "0.10.0", default-features = false }
mt_action = { path = "mt_action", version = "0.10.0", default-features = false }
mt_scope = { path = "mt_scope", version = "0.10.0", default-features = false }
mt_bagread = { path = "mt_bagread", version = "0.10.0", default-features = false }
mt_net = { path = "mt_net", version = "0.10.0", default-features = false }
mt_flow = { path = "mt_flow", version = "0.10.0", default-features = false }
mt_wind = { path = "mt_wind", version = "0.10.0", default-features = false }
mt_mtc = { path = "mt_mtc", version = "0.10.0", default-features = false }
mt_log = { path = "mt_log", version = "0.10.0", default-features = false }
marina = { path = "../marina", default-features = false, features = ["minot-registry"] }

# Tools
anyhow = "1.0"
serde_json = "1.0"
async-trait = "0.1.92"
env_logger = "0.11.11"
log = "0.4.34"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"

crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4.45"
tui-logger = "0.18.3"
regex = "1.13"
once_cell = "1.21"
rust_decimal = "1.42.1"
logos = "0.16.1"
chumsky = { version = "0.13", default-features = false, features = ["std"] }
ariadne = "0.6"
mcap = "0.25.0"
camino = "1.2"
serde_yml = "0.0.13"
cdr = "0.2.4"
rand = "0.10"
fs2 = "0.4"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["full"] }
cdr-encoding = "0.11"
bytesize = "2.7"

# IO
futures-lite = "2.6"
tokio = { version = "1.53", features = ["signal", "process"] }
zenoh = { version = "1.10", features = [
  "transport_multilink",
  "transport_tcp",
  "unstable",
] }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
rkyv = { version = "0.8.18" }
serde = { version = "1.0", features = ["derive"] }

# ROS
r2r = "0.9.5"
hiroz = { version = "0.2.0", git = "https://github.com/ZettaScaleLabs/hiroz.git", tag = "v0.2.0" }
hiroz-msgs = { version = "0.2.0", git = "https://github.com/ZettaScaleLabs/hiroz.git", tag = "v0.2.0", default-features = false, features = [
  "std_msgs",
  "geometry_msgs",
  "sensor_msgs",
  "nav_msgs",
  "rosgraph_msgs",
] }
ros2-client = { version = "0.10.0" }
ros2-interfaces-jazzy-serde = { version = "0.0.5", features = [
  "std_msgs",
  "geometry_msgs",
  "sensor_msgs",
  "nav_msgs",
  "rosgraph_msgs",
  "builtin_interfaces",
] }
ros2-interfaces-jazzy-rkyv = { version = "0.0.5", features = [
  "std_msgs",
  "geometry_msgs",
  "sensor_msgs",
  "nav_msgs",
  "rosgraph_msgs",
  "builtin_interfaces",
] }
roslibrust = { version = "0.21", features = ["ros1", "macro"] }

[profile.release]
strip = "symbols" # Significantly reduce binary size
opt-level = "s"   # Optimize for size but keep some performance
debug = 0

[profile.full-release]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.colcon]
inherits = "release"
