[package]
name = "mt_pubsub"
description = "A simple and deterministic Pub/Sub implementation with Minot primitives."
version.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
categories.workspace = true
documentation.workspace = true
homepage.workspace = true
rust-version.workspace = true
exclude.workspace = true

[dependencies]
mt_sea.workspace = true
mt_coord = { workspace = true, features = ["embed-scope"] }
mt_net.workspace = true
zenoh.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
tokio-util.workspace = true
pin-project-lite = "0.2"
rkyv.workspace = true
bytes.workspace = true
anyhow.workspace = true
quinn.workspace = true
quinn-proto.workspace = true
rustls.workspace = true
rcgen.workspace = true
socket2.workspace = true
futures-lite = { workspace = true, optional = true }

[target.'cfg(all(unix, not(any(target_os = "ios", target_os = "android"))))'.dependencies]
rustix = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }

[features]
default = ["image", "zenoh-defaults"]
zenoh-defaults = ["mt_sea/zenoh-defaults"]
image = ["mt_net/image"]
# Shared memory between processes on one machine, for Zenoh and QUIC alike.
shm = ["mt_sea/shm", "dep:rustix", "dep:memmap2"]
smol = ["dep:futures-lite"]

[dev-dependencies]
ros2-interfaces-jazzy-rkyv.workspace = true
futures-lite.workspace = true

[[example]]
name = "smol"
path = "examples/smol.rs"
required-features = ["smol"]
