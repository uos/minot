[package]
name = "mt_pubsub"
description = "A simple and deterministic Pub/Sub implementation with Minot primitives."
version.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
categories.workspace = true
documentation.workspace = true
homepage.workspace = true
rust-version.workspace = true
exclude.workspace = true

[dependencies]
mt_sea.workspace = true
mt_coord = { workspace = true, features = ["embed-scope"] }
mt_net.workspace = true
zenoh.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rkyv.workspace = true
anyhow.workspace = true
futures-lite = { workspace = true, optional = true }

[features]
default = ["image", "zenoh-defaults"]
zenoh-defaults = ["mt_sea/zenoh-defaults"]
image = ["mt_net/image"]
shm = ["mt_sea/shm"]
smol = ["dep:futures-lite"]

[dev-dependencies]
ros2-interfaces-jazzy-rkyv.workspace = true

[[example]]
name = "smol"
path = "examples/smol.rs"
required-features = ["smol"]
