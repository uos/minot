          mkdir -p out

          $CARGO_CMD --package minot --bin minot --no-default-features --features embed-coord,embed-ros2-c-humble,db3
          cp target/$RUST_TARGET/full-release/minot "out/minot-humble-$RUST_TARGET"

          $CARGO_CMD --package minot --bin minot --no-default-features --features embed-coord,embed-ros2-c-humble,embed-ros1-native,db3
          cp target/$RUST_TARGET/full-release/minot "out/minot-humble-ros1-$RUST_TARGET"

