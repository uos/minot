      - name: Build
        run: |
          export AMENT_TRACE_SETUP_FILES="${AMENT_TRACE_SETUP_FILES:-}"
          source /opt/ros/humble/setup.bash
          bash ./scripts/make-deb.bash

      - name: "Upload deb"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-deb-humble-arm64
          path: |
            *.deb

  jazzy-linux-aarch64-gnu:
    runs-on: ubuntu-latest-arm
    container:
      image: docker.io/stelzo/ubuntu-dev:jazzy
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get install -y curl git openssl unzip clang
          apt-get update --assume-yes && apt-get install locales --assume-yes
          locale-gen en_US en_US.UTF-8
          export LANG=en_US.UTF-8
          apt-get install software-properties-common --assume-yes
          # ROS2 Jazzy
          add-apt-repository universe -y
          apt-get update --assume-yes
          curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | tee /etc/apt/sources.list.d/ros2.list > /dev/null
          apt-get update --assume-yes && apt-get install ros-dev-tools ros-jazzy-ros-base --assume-yes

      - name: Build
        env:
          RUST_TARGET: aarch64-unknown-linux-gnu
          CARGO_PROFILE_FULL_RELEASE_LTO: thin
          CARGO_PROFILE_FULL_RELEASE_CODEGEN_UNITS: 16
        run: |
          export AMENT_TRACE_SETUP_FILES="${AMENT_TRACE_SETUP_FILES:-}"
          source /opt/ros/jazzy/setup.bash
          rustup target add $RUST_TARGET
          CARGO_CMD="cargo build --target $RUST_TARGET --profile full-release"
          mkdir -p out

          $CARGO_CMD --package minot --bin minot --no-default-features --features embed-coord,embed-ros2-c,db3
          cp target/$RUST_TARGET/full-release/minot "out/minot-jazzy-$RUST_TARGET"

          (cd out && for f in minot-*; do shasum -a 256 "$f" > "$f.sha256"; done)

      - name: "Upload binaries"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-jazzy-aarch64-unknown-linux-gnu
          path: out/*

  humble-linux-x86_64-gnu:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:humble
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get install -y curl git openssl unzip clang
          apt-get update --assume-yes && apt-get install locales --assume-yes
          locale-gen en_US en_US.UTF-8
          export LANG=en_US.UTF-8
          apt-get install software-properties-common --assume-yes
          # ROS2 Humble
          add-apt-repository universe -y
          apt-get update --assume-yes
          curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | tee /etc/apt/sources.list.d/ros2.list > /dev/null
          apt-get update --assume-yes && apt-get install ros-dev-tools ros-humble-ros-base --assume-yes

      - name: Build
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
        run: |
          export AMENT_TRACE_SETUP_FILES="${AMENT_TRACE_SETUP_FILES:-}"
          source /opt/ros/humble/setup.bash
          rustup target add $RUST_TARGET
          CARGO_CMD="cargo build --target $RUST_TARGET --profile full-release"
          mkdir -p out

          $CARGO_CMD --package minot --bin minot --no-default-features --features embed-coord,embed-ros2-c-humble,db3
          cp target/$RUST_TARGET/full-release/minot "out/minot-humble-$RUST_TARGET"

          $CARGO_CMD --package minot --bin minot --no-default-features --features embed-coord,embed-ros2-c-humble,embed-ros1-native,db3
          cp target/$RUST_TARGET/full-release/minot "out/minot-humble-ros1-$RUST_TARGET"

          (cd out && for f in minot-*; do shasum -a 256 "$f" > "$f.sha256"; done)

      - name: "Upload binaries"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-humble-x86_64-unknown-linux-gnu
          path: out/*

