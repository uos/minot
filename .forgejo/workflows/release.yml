  linux-pypi:
    runs-on: ubuntu-dev-resolute
    needs: [rust-stable]
    strategy:
      matrix:
        # omitting ppc64le and s390x since they do not compile and probably have other problems than running this software
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        env:
          # Manually define ARM architecture for ring 0.17+ on older GCC
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ulimit -n 65536
          rustup target add "$TARGET"
          maturin build --zig --manifest-path minot/Cargo.toml --profile full-release --target-dir wheels --target "$TARGET"
      - name: Upload wheels
        uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: target/wheels

  musllinux-pypi:
    runs-on: ubuntu-dev-resolute
    needs: [rust-stable]
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ulimit -n 65536
          rustup target add "$TARGET"
          maturin build --zig --manifest-path minot/Cargo.toml --profile full-release --target-dir wheels --target "$TARGET"
      - name: Upload wheels
        uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: target/wheels

  macos-pypi:
    runs-on: macos-latest
    needs: [rust-stable]
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          maturin build --manifest-path minot/Cargo.toml --profile full-release --target-dir wheels --target "$TARGET"
      - name: Upload wheels
        uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: target/wheels

  # Source distribution, pip will try to build from source.
  sdist-pypi:
    runs-on: ubuntu-dev-resolute
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: |
          set -euo pipefail
          maturin sdist --manifest-path minot/Cargo.toml --out target/wheels
      - name: Upload sdist
        uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: target/wheels

  create-release:
    runs-on: ubuntu-dev-resolute
    needs: [
        linux-x86_64-musl,
        linux-x86_64-gnu,
        linux-aarch64-gnu,
        linux-armv7-gnu,
        macos-aarch64,
        jazzy-linux-x86_64-gnu,
        jazzy-linux-aarch64-gnu,
        humble-linux-x86_64-gnu,
        humble-linux-aarch64-gnu,
        deb-humble-amd64,
        deb-humble-arm64,
        deb-jazzy-amd64,
        deb-jazzy-arm64,
        deb-lyrical,
        linux-pypi,
        musllinux-pypi,
        macos-pypi,
        sdist-pypi,
      ]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: List downloaded artifacts (for verification)
        run: ls -R artifacts
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME}}"
          REPO="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}"
          SERVER="${FORGEJO_SERVER_URL:-https://codeberg.org}"

          tea login add --name codeberg --url "${SERVER}" --token "${GITHUB_TOKEN}"
          tea release delete --repo "${REPO}" --confirm "${TAG}" || true

          ASSET_FLAGS=""
          while IFS= read -r f; do
            ASSET_FLAGS="${ASSET_FLAGS} --asset ${f}"
          done <<EOF
          $(find artifacts -type f | sort)
          EOF

          tea release create \
            --login codeberg \
            --repo "${REPO}" \
            --tag "${TAG}" \
            --title "${TAG}" \
            --note "Release ${TAG}

          ### Artifacts
          - \`minot-<target>\` binaries for Linux and macOS, plus ROS variants (\`minot-jazzy-*\`, \`minot-humble-*\`, \`minot-humble-ros1-*\`)
          - The rat library as \`librat-<target>.{a,so,dylib}\` with \`rat.h\`, \`librat.pc\` and \`libratConfig.cmake\`
          - Debian packages published to the steado PPA
          - Python wheels published to PyPI" \
            ${ASSET_FLAGS}

  publish-pypi:
    needs:
      - create-release
    runs-on: ubuntu-dev-resolute
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v3
        with:
          name: wheels
          path: dist
      - name: Get twine
        run: uv tool install twine
      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Python distributions to publish ==="
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print -exec ls -lh {} \;

          twine upload \
            --username __token__ \
            --password "${PYPI_TOKEN}" \
            --non-interactive \
            --skip-existing \
            --verbose \
            $(find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) | sort)

          echo "Published to PyPI."

  release-ppa:
    runs-on: ubuntu-dev-resolute
    needs:
      [
        create-release,
        deb-humble-amd64,
        deb-humble-arm64,
        deb-jazzy-amd64,
        deb-jazzy-arm64,
        deb-lyrical,
        ppa-minot-rat-debs,
      ]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Push to PPA
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PPA_DEPLOY_KEY: ${{ secrets.PPA_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends openssh-client rsync

          # Humble builds target jammy, Jazzy noble and Lyrical resolute. The minot-rat debs exist
          # for jammy and noble.
          add_debs() {
            local series="$1"
            shift
            local debs=()
            for pattern in "$@"; do
              mapfile -t -O "${#debs[@]}" debs < <(find artifacts -path "artifacts/${pattern}" -type f)
            done
            if [ "${#debs[@]}" -eq 0 ]; then
              echo "No debs found for ${series}" >&2
              exit 1
            fi
            mkdir -p "upload/ubuntu/pool/main/${series}"
            cp "${debs[@]}" "upload/ubuntu/pool/main/${series}/"
          }
          add_debs jammy "artifacts-deb-humble-*/*.deb" "artifacts-ppa-minot-rat-jammy-*/*.deb"
          add_debs noble "artifacts-deb-jazzy-*/*.deb" "artifacts-ppa-minot-rat-noble-*/*.deb"
          add_debs resolute "artifacts-deb-lyrical-*/*.deb"

          # The server prunes old versions and signs the apt metadata.
          mkdir -p ~/.ssh
          printf '%s\n' "$PPA_DEPLOY_KEY" > ~/.ssh/ppa_key
          chmod 600 ~/.ssh/ppa_key
          echo "[ppa.steado.tech]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvqpiJdvk+zuDXcjOgNdA3p98+6L7MAnhOEOLrw4phX" > ~/.ssh/ppa_known_hosts
          PPA_SSH="ssh -i $HOME/.ssh/ppa_key -p 2222 -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/ppa_known_hosts -o StrictHostKeyChecking=yes"
          rsync -rt --chmod=F644,D755 -e "$PPA_SSH" upload/ ppa@ppa.steado.tech:
          $PPA_SSH ppa@ppa.steado.tech publish
          shred -u ~/.ssh/ppa_key || rm -f ~/.ssh/ppa_key

  aur-publish-src:
    runs-on: ubuntu-dev-resolute
    needs: [create-release]
    container:
      image: archlinux:latest
    steps:
      - name: Deps
        run: |
          pacman -Sy --noconfirm openssl openssh git nodejs sudo base-devel
          useradd -m build
          echo "build ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/build
      - uses: actions/checkout@v4
      - name: Update AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p /home/build/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /home/build/.ssh/aur_key
          chmod 600 /home/build/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> /home/build/.ssh/known_hosts
          chown -R build:build . /home/build/.ssh

          sudo -u build env \
            GIT_SSH_COMMAND='ssh -i /home/build/.ssh/aur_key -o UserKnownHostsFile=/home/build/.ssh/known_hosts -o StrictHostKeyChecking=yes' \
            FORGEJO_REPOSITORY="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}" \
            FORGEJO_SHA="${FORGEJO_SHA:-${GITHUB_SHA}}" \
            bash << 'EOF'
            set -euo pipefail
            git config --global user.email "$(git log -1 --pretty=format:'%ae')"
            git config --global user.name "$(git log -1 --pretty=format:'%an')"
            git clone ssh://aur@aur.archlinux.org/minot.git minot-aur
            cp packaging/arch/PKGBUILD minot-aur/
            cd minot-aur
            makepkg --printsrcinfo > .SRCINFO
            git add -f .SRCINFO PKGBUILD
            git commit -m "Update package from $FORGEJO_REPOSITORY@$FORGEJO_SHA" || echo "No changes"
            git push origin
          EOF
          shred -u /home/build/.ssh/aur_key

  aur-publish-bin:
    runs-on: ubuntu-dev-resolute
    needs: [create-release]
    container:
      image: archlinux:latest
    steps:
      - name: Deps
        run: |
          pacman -Sy --noconfirm openssl openssh git nodejs sudo base-devel
          useradd -m build
          echo "build ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/build
      - uses: actions/checkout@v4
      - name: Update AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p /home/build/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /home/build/.ssh/aur_key
          chmod 600 /home/build/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> /home/build/.ssh/known_hosts
          chown -R build:build . /home/build/.ssh

          sudo -u build env \
            GIT_SSH_COMMAND='ssh -i /home/build/.ssh/aur_key -o UserKnownHostsFile=/home/build/.ssh/known_hosts -o StrictHostKeyChecking=yes' \
            FORGEJO_REPOSITORY="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY}}" \
            FORGEJO_SHA="${FORGEJO_SHA:-${GITHUB_SHA}}" \
            bash << 'EOF'
            set -euo pipefail
            git config --global user.email "$(git log -1 --pretty=format:'%ae')"
            git config --global user.name "$(git log -1 --pretty=format:'%an')"
            git clone ssh://aur@aur.archlinux.org/minot-bin.git minot-bin
            cp packaging/arch-bin/PKGBUILD minot-bin/
            cd minot-bin
            makepkg --printsrcinfo > .SRCINFO
            git add -f .SRCINFO PKGBUILD
            git commit -m "Update package from $FORGEJO_REPOSITORY@$FORGEJO_SHA" || echo "No changes"
            git push origin
          EOF
          shred -u /home/build/.ssh/aur_key

  homebrew-publish:
    runs-on: ubuntu-dev-resolute
    needs: [create-release]
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS artifact
        uses: actions/download-artifact@v3
        with:
          name: artifacts-aarch64-apple-darwin
          path: macos
      # rat.h, librat.pc and libratConfig.cmake are uploaded once, by the x86_64 GNU build.
      - name: Download shared rat files
        uses: actions/download-artifact@v3
        with:
          name: artifacts-x86_64-unknown-linux-gnu
          path: shared
      - name: Compute checksums and update formula
        run: |
          set -euo pipefail
          VERSION="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME}}"
          VERSION="${VERSION#v}"
          sha() { sha256sum "$1" | awk '{print $1}'; }
          sed -e "s/VERSION_PLACEHOLDER/${VERSION}/g" \
              -e "s/MINOT_SHA256_PLACEHOLDER/$(sha macos/minot-aarch64-apple-darwin)/g" \
              -e "s/LIBRAT_A_SHA256_PLACEHOLDER/$(sha macos/librat-aarch64-apple-darwin.a)/g" \
              -e "s/LIBRAT_DYLIB_SHA256_PLACEHOLDER/$(sha macos/librat-aarch64-apple-darwin.dylib)/g" \
              -e "s/RAT_H_SHA256_PLACEHOLDER/$(sha shared/rat.h)/g" \
              -e "s/LIBRAT_PC_SHA256_PLACEHOLDER/$(sha shared/librat.pc)/g" \
              -e "s/LIBRAT_CMAKE_SHA256_PLACEHOLDER/$(sha shared/libratConfig.cmake)/g" \
            packaging/homebrew/minot.rb > minot.rb
          if grep -q "_PLACEHOLDER" minot.rb; then
            echo "Unreplaced placeholder in minot.rb" >&2
            exit 1
          fi
      - name: Push to Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y openssh-client
          mkdir -p ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes'
          git clone --depth 1 git@github.com:uos/homebrew-tools.git tap
          mkdir -p tap/Formula
          cp minot.rb tap/Formula/minot.rb
          cd tap
          git config user.email "stelzo@steado.de"
          git config user.name "stelzo"
          git add Formula/minot.rb
          git commit -m "Update minot to ${FORGEJO_REF_NAME:-${GITHUB_REF_NAME}}" || echo "No changes"
          git push origin main
          shred -u ~/.ssh/deploy_key || rm -f ~/.ssh/deploy_key

  publish-crates:
    needs:
      - create-release
    runs-on: ubuntu-dev-resolute
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: apt-get update && apt-get install -y pkg-config libssl-dev
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          bash ./scripts/cargo-publish.sh
