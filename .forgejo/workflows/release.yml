# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
# Release Workflow for Minot. The schema is used until there is one for Forgejo.

name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust-stable:
    runs-on: ubuntu-dev-resolute
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: apt-get update && apt-get install -y pkg-config libssl-dev
      - name: Build
        run: cargo build --verbose

  # -------------------------------------------------------------------------
  # STANDARD LINUX TARGETS (Musl, GNU x86/ARM)
  # Builds: default Minot (coord + mt-pubsub) and the rat library
  # -------------------------------------------------------------------------

  linux-x86_64-musl:
    runs-on: ubuntu-dev-resolute
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: apt-get update && apt-get install -y musl-tools pkg-config libssl-dev
      - name: Build
        env:
          RUST_TARGET: x86_64-unknown-linux-musl
        run: |
          rustup target add $RUST_TARGET
          export RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --target $RUST_TARGET --profile full-release --package minot --bin minot
          # Build only the C artifacts. Without the rlib the staticlib gets real LTO and no embedded bitcode.
          cargo rustc --target $RUST_TARGET --profile full-release --package mt_rat --lib --crate-type staticlib

          # Release assets are the raw files, suffixed with the target so they stay unique.
          mkdir -p out
          cp target/$RUST_TARGET/full-release/minot "out/minot-$RUST_TARGET"
          cp target/$RUST_TARGET/full-release/librat.a "out/librat-$RUST_TARGET.a"
          (cd out && for f in minot-* librat-*; do if [ -f "$f" ]; then shasum -a 256 "$f" > "$f.sha256"; fi; done)

      - name: "Upload binaries"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-x86_64-unknown-linux-musl
          path: out/*

  linux-x86_64-gnu:
    runs-on: ubuntu-dev-resolute
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: apt-get update && apt-get install -y pkg-config libssl-dev
      - name: Build
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
        run: |
          rustup target add $RUST_TARGET
          cargo build --target $RUST_TARGET --profile full-release --package minot --bin minot
          # Build only the C artifacts. Without the rlib the staticlib gets real LTO and no embedded bitcode.
          cargo rustc --target $RUST_TARGET --profile full-release --package mt_rat --lib --crate-type staticlib,cdylib

          VERSION="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME}}"
          VERSION="${VERSION#v}"
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" mt_rat/librat.pc > mt_rat/librat.pc.tmp && mv mt_rat/librat.pc.tmp mt_rat/librat.pc
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" mt_rat/libratConfig.cmake > mt_rat/libratConfig.cmake.tmp && mv mt_rat/libratConfig.cmake.tmp mt_rat/libratConfig.cmake

          # Release assets are the raw files, suffixed with the target so they stay unique.
          mkdir -p out
          cp target/$RUST_TARGET/full-release/minot "out/minot-$RUST_TARGET"
          cp target/$RUST_TARGET/full-release/librat.a "out/librat-$RUST_TARGET.a"
          cp target/$RUST_TARGET/full-release/librat.so "out/librat-$RUST_TARGET.so"
          (cd out && for f in minot-* librat-*; do if [ -f "$f" ]; then shasum -a 256 "$f" > "$f.sha256"; fi; done)

          # Target independent librat files, uploaded once.
          cp mt_rat/rat.h mt_rat/librat.pc mt_rat/libratConfig.cmake out/

          # Create Debian Package
          cargo deb --package mt_rat --target $RUST_TARGET --no-build --profile full-release
          cargo deb --package minot --target $RUST_TARGET --no-build --profile full-release
          find target/$RUST_TARGET/debian -name "*.deb" -exec cp {} out/ \;

      - name: "Upload binaries"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-x86_64-unknown-linux-gnu
          path: out/*

  linux-aarch64-gnu:
    runs-on: ubuntu-dev-resolute
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: apt-get update && apt-get install -y gcc-aarch64-linux-gnu pkg-config libssl-dev
      - name: Build
        env:
          RUST_TARGET: aarch64-unknown-linux-gnu
        run: |
          rustup target add $RUST_TARGET
          cargo build --target $RUST_TARGET --profile full-release --package minot --bin minot
          # Build only the C artifacts. Without the rlib the staticlib gets real LTO and no embedded bitcode.
          cargo rustc --target $RUST_TARGET --profile full-release --package mt_rat --lib --crate-type staticlib,cdylib

          VERSION="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME}}"
          VERSION="${VERSION#v}"
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" mt_rat/librat.pc > mt_rat/librat.pc.tmp && mv mt_rat/librat.pc.tmp mt_rat/librat.pc
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" mt_rat/libratConfig.cmake > mt_rat/libratConfig.cmake.tmp && mv mt_rat/libratConfig.cmake.tmp mt_rat/libratConfig.cmake

          # Release assets are the raw files, suffixed with the target so they stay unique.
          mkdir -p out
          cp target/$RUST_TARGET/full-release/minot "out/minot-$RUST_TARGET"
          cp target/$RUST_TARGET/full-release/librat.a "out/librat-$RUST_TARGET.a"
          cp target/$RUST_TARGET/full-release/librat.so "out/librat-$RUST_TARGET.so"
          (cd out && for f in minot-* librat-*; do if [ -f "$f" ]; then shasum -a 256 "$f" > "$f.sha256"; fi; done)

          # Create Debian Package
          cargo deb --package mt_rat --target $RUST_TARGET --no-build --profile full-release
          cargo deb --package minot --target $RUST_TARGET --no-build --profile full-release
          find target/$RUST_TARGET/debian -name "*.deb" -exec cp {} out/ \;

      - name: "Upload binaries"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-aarch64-unknown-linux-gnu
          path: out/*

  linux-armv7-gnu:
    runs-on: ubuntu-dev-resolute
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: apt-get update && apt-get install -y gcc-arm-linux-gnueabihf pkg-config libssl-dev
      - name: Build
        env:
          RUST_TARGET: armv7-unknown-linux-gnueabihf
        run: |
          rustup target add $RUST_TARGET
          cargo build --target $RUST_TARGET --profile full-release --package minot --bin minot
          # Build only the C artifacts. Without the rlib the staticlib gets real LTO and no embedded bitcode.
          cargo rustc --target $RUST_TARGET --profile full-release --package mt_rat --lib --crate-type staticlib,cdylib

          VERSION="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME}}"
          VERSION="${VERSION#v}"
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" mt_rat/librat.pc > mt_rat/librat.pc.tmp && mv mt_rat/librat.pc.tmp mt_rat/librat.pc
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" mt_rat/libratConfig.cmake > mt_rat/libratConfig.cmake.tmp && mv mt_rat/libratConfig.cmake.tmp mt_rat/libratConfig.cmake

          # Release assets are the raw files, suffixed with the target so they stay unique.
          mkdir -p out
          cp target/$RUST_TARGET/full-release/minot "out/minot-$RUST_TARGET"
          cp target/$RUST_TARGET/full-release/librat.a "out/librat-$RUST_TARGET.a"
          cp target/$RUST_TARGET/full-release/librat.so "out/librat-$RUST_TARGET.so"
          (cd out && for f in minot-* librat-*; do if [ -f "$f" ]; then shasum -a 256 "$f" > "$f.sha256"; fi; done)

          # Create Debian Package
          cargo deb --package mt_rat --target $RUST_TARGET --no-build --profile full-release
          cargo deb --package minot --target $RUST_TARGET --no-build --profile full-release
          find target/$RUST_TARGET/debian -name "*.deb" -exec cp {} out/ \;

      - name: "Upload binaries"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-armv7-unknown-linux-gnueabihf
          path: out/*

  ppa-minot-rat-debs:
    runs-on: ubuntu-dev-resolute
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: jammy
            image: docker.io/stelzo/ubuntu-dev:jammy
            target: x86_64-unknown-linux-gnu
            apt_deps: ""
          - series: jammy
            image: docker.io/stelzo/ubuntu-dev:jammy
            target: aarch64-unknown-linux-gnu
            apt_deps: "gcc-aarch64-linux-gnu"
          - series: jammy
            image: docker.io/stelzo/ubuntu-dev:jammy
            target: armv7-unknown-linux-gnueabihf
            apt_deps: "gcc-arm-linux-gnueabihf"
          - series: noble
            image: docker.io/stelzo/ubuntu-dev:noble
            target: x86_64-unknown-linux-gnu
            apt_deps: ""
          - series: noble
            image: docker.io/stelzo/ubuntu-dev:noble
            target: aarch64-unknown-linux-gnu
            apt_deps: "gcc-aarch64-linux-gnu"
          - series: noble
            image: docker.io/stelzo/ubuntu-dev:noble
            target: armv7-unknown-linux-gnueabihf
            apt_deps: "gcc-arm-linux-gnueabihf"
    #          - series: resolute
    #            image: docker.io/stelzo/ubuntu-dev:resolute
    #            target: x86_64-unknown-linux-gnu
    #            apt_deps: ""
    #          - series: resolute
    #            image: docker.io/stelzo/ubuntu-dev:resolute
    #            target: aarch64-unknown-linux-gnu
    #            apt_deps: "gcc-aarch64-linux-gnu"
    #          - series: resolute
    #            image: docker.io/stelzo/ubuntu-dev:resolute
    #            target: armv7-unknown-linux-gnueabihf
    #            apt_deps: "gcc-arm-linux-gnueabihf"
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native PPA debs
        env:
          RUST_TARGET: ${{ matrix.target }}
          APT_DEPS: ${{ matrix.apt_deps }}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl openssl build-essential pkg-config git $APT_DEPS
          rustup target add "$RUST_TARGET"

          CARGO_CMD="cargo build --target $RUST_TARGET --profile full-release"
          $CARGO_CMD --package minot --bin minot --features embed-coord,embed-mt-pubsub,shm
          cargo rustc --target "$RUST_TARGET" --profile full-release --package mt_rat --lib --crate-type staticlib,cdylib

          VERSION="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME}}"
          VERSION="${VERSION#v}"
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" mt_rat/librat.pc > mt_rat/librat.pc.tmp
          mv mt_rat/librat.pc.tmp mt_rat/librat.pc
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" mt_rat/libratConfig.cmake > mt_rat/libratConfig.cmake.tmp
          mv mt_rat/libratConfig.cmake.tmp mt_rat/libratConfig.cmake

          cargo deb --package mt_rat --target "$RUST_TARGET" --no-build --profile full-release
          cargo deb --package minot --target "$RUST_TARGET" --no-build --profile full-release
          find "target/$RUST_TARGET/debian" -name "*.deb" -exec cp {} . \;
      - name: "Upload PPA debs"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-ppa-minot-rat-${{ matrix.series }}-${{ matrix.target }}
          path: |
            *.deb

  # -------------------------------------------------------------------------
  # MACOS TARGETS
  # Builds: default Minot (coord + mt-pubsub) and the rat library
  # -------------------------------------------------------------------------

  macos-aarch64:
    runs-on: macos-latest
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          RUST_TARGET: aarch64-apple-darwin
        run: |
          rustup target add $RUST_TARGET
          cargo build --target $RUST_TARGET --profile full-release --package minot --bin minot
          # Build only the C artifacts. Without the rlib the staticlib gets real LTO and no embedded bitcode.
          cargo rustc --target $RUST_TARGET --profile full-release --package mt_rat --lib --crate-type staticlib,cdylib

          # Release assets are the raw files, suffixed with the target so they stay unique.
          mkdir -p out
          cp target/$RUST_TARGET/full-release/minot "out/minot-$RUST_TARGET"
          cp target/$RUST_TARGET/full-release/librat.a "out/librat-$RUST_TARGET.a"
          cp target/$RUST_TARGET/full-release/librat.dylib "out/librat-$RUST_TARGET.dylib"
          (cd out && for f in minot-* librat-*; do if [ -f "$f" ]; then shasum -a 256 "$f" > "$f.sha256"; fi; done)

      - name: "Upload binaries"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-aarch64-apple-darwin
          path: out/*

  # -------------------------------------------------------------------------
  # ROS TARGETS (Jazzy / Humble)
  # Builds: ROS-specific Minot variants. The winds are not shipped, build them from source.
  # -------------------------------------------------------------------------

  jazzy-linux-x86_64-gnu:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:jazzy
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get install -y curl git openssl unzip clang
          apt-get update --assume-yes && apt-get install locales --assume-yes
          locale-gen en_US en_US.UTF-8
          export LANG=en_US.UTF-8
          apt-get install software-properties-common --assume-yes
          # ROS2 Jazzy
          add-apt-repository universe -y
          apt-get update --assume-yes
          curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | tee /etc/apt/sources.list.d/ros2.list > /dev/null
          apt-get update --assume-yes && apt-get install ros-dev-tools ros-jazzy-ros-base --assume-yes

      - name: Build
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
        run: |
          export AMENT_TRACE_SETUP_FILES="${AMENT_TRACE_SETUP_FILES:-}"
          source /opt/ros/jazzy/setup.bash
          rustup target add $RUST_TARGET
          CARGO_CMD="cargo build --target $RUST_TARGET --profile full-release"
          mkdir -p out

          $CARGO_CMD --package minot --bin minot --no-default-features --features embed-coord,embed-ros2-c,db3
          cp target/$RUST_TARGET/full-release/minot "out/minot-jazzy-$RUST_TARGET"

          (cd out && for f in minot-*; do shasum -a 256 "$f" > "$f.sha256"; done)

      - name: "Upload binaries"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-jazzy-x86_64-unknown-linux-gnu
          path: out/*

  deb-jazzy-amd64:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:jazzy
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get install -y curl git openssl unzip clang
          apt-get update --assume-yes && apt-get install locales --assume-yes
          locale-gen en_US en_US.UTF-8
          export LANG=en_US.UTF-8
          apt-get install software-properties-common --assume-yes
          # ROS2 Jazzy
          add-apt-repository universe -y
          apt-get update --assume-yes
          curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | tee /etc/apt/sources.list.d/ros2.list > /dev/null
          apt-get update --assume-yes && apt-get install ros-dev-tools ros-jazzy-ros-base --assume-yes
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update

      - name: Build
        run: |
          export AMENT_TRACE_SETUP_FILES="${AMENT_TRACE_SETUP_FILES:-}"
          source /opt/ros/jazzy/setup.bash
          bash ./scripts/make-deb.bash

      - name: "Upload deb"
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-deb-jazzy-amd64
          path: |
            *.deb

  deb-jazzy-arm64:
    runs-on: ubuntu-latest-arm
    container:
      image: docker.io/stelzo/ubuntu-dev:jazzy
    needs: [rust-stable]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get install -y curl git openssl unzip clang
          apt-get update --assume-yes && apt-get install locales --assume-yes
          locale-gen en_US en_US.UTF-8
