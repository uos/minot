[package]
name = "mt_dataset"
description = "Dataset discovery, caching, registry access, and resumable Minot transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
documentation.workspace = true
homepage.workspace = true
exclude.workspace = true

[features]
default = ["osnabotics-default-registry", "db3"]
osnabotics-default-registry = ["gdrive"]
db3 = ["dep:rusqlite"]
gdrive = ["dep:base64", "dep:ring", "dep:regex"]
minot-registry = ["dep:mt_flow", "dep:mt_pubsub", "dep:mt_sea", "dep:mt_service", "dep:rkyv"]
cloudini-cpp = ["cloudini/use_cpp"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
clap_complete = { workspace = true, features = ["unstable-dynamic"] }
env_logger.workspace = true
futures.workspace = true
libc.workspace = true
log.workspace = true
mcap.workspace = true
nalgebra.workspace = true
rand.workspace = true
regex = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "fs", "sync", "time"] }

mt_flow = { workspace = true, optional = true }
mt_pubsub = { workspace = true, optional = true }
mt_sea = { workspace = true, optional = true }
mt_service = { workspace = true, optional = true }

base64 = { version = "0.23", optional = true }
cdr = "0.2"
cloudini = { version = "0.3", default-features = false, features = ["ros"] }
ctrlc = "3.5"
dirs = "6.0"
flate2 = "1.1"
glob = "0.3"
humantime = "2.3"
indicatif = "0.18"
ratslang = "0.4.3"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "query", "rustls", "stream"] }
ring = { version = "0.17", optional = true }
ros2-interfaces-jazzy-serde = { version = "0.0.5", features = ["sensor_msgs", "std_msgs", "builtin_interfaces"] }
ros_pointcloud2 = { version = "1.0.0-rc.4", features = ["ros2_interfaces_jazzy_serde"] }
rpassword = "7"
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "2.4"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.27"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.27"

[lints.clippy]
collapsible_if = "allow"
manual_is_multiple_of = "allow"
redundant_pattern_matching = "allow"
