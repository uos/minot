[project]
site_name = "Minot"
site_description = "A versatile toolset for debugging and verifying stateful robot perception software."
site_author = "stelzo <stelzo@steado.de>"
site_url = "https://minot.steado.tech/"
repo_url = "https://codeberg.org/stelzo/minot"
repo_name = "stelzo/minot"
strict = true
extra_css = ["stylesheets/fonts.css", "stylesheets/seakit.css", "stylesheets/brand.css"]
copyright = """
Copyright &copy; 2026 stelzo
"""
nav = [
  { "Introduction" = "index.md" },
  { "Getting Started" = [
    "intro/query.md",
    "intro/share.md",
    "intro/pubsub.md",
  ] },
  { "Installation" = [
    "installation/ros.md",
    "installation/script.md",
    "installation/tools.md",
    "installation/packages.md",
    { "Pub/Sub (Rust/Go)" = "installation/pubsub.md" },
    { "Share Library (C/Rust)" = "installation/librat.md" },
    "installation/publisher.md",
    "installation/archives.md",
  ] },
  { "Features" = [
    { "Features" = [
      "features/bagquery.md",
      "features/varshare.md",
      "features/pubsub.md",
      "features/services.md",
      "features/actions.md",
    ] },
    { "Sync" = [
      "features/sync/overview.md",
      "features/sync/keybindings.md",
    ] },
    { "API" = [
      "features/api.md",
    ] },
  ] },
  { "Extra" = "lore.md" },
]

[project.theme]
font = false
language = "en"
logo = "images/minot.svg"
favicon = "images/minot.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/git-alt"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.blocks.caption]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.abbr]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tabbed.slugify]
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }

[project.plugins.offline]
